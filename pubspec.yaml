name: ovpn_client
description: OpenVPN Client Free — open-source Android OpenVPN client (GPLv2+).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  file_picker: ^8.1.7
  path: ^1.9.1
  url_launcher: ^6.3.1
  vpn_android:
    path: packages/vpn_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
